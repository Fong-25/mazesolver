; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
board_hardware.bod = 4.3v
lib_deps = adafruit/Adafruit NeoPixel@^1.15.5
            pololu/VL53L0X@^1.3.1
; RAM optimization: default Wire/Serial buffers (32 and 64 bytes) are sized
; for general-purpose use. This project's largest single I2C transaction
; is 7 bytes (VL53L0X's SPAD-map read/write) and BT commands/lines are
; short, so both are cut generously and still safe.
build_flags =
    -D TWI_BUFFER_LENGTH=16
    -D SERIAL_RX_BUFFER_SIZE=32
    -D SERIAL_TX_BUFFER_SIZE=32
[env:nanoisp]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = stk500v1
upload_port = COM12
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xDA
board_fuses.efuse = 0xFC